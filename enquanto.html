<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Laço de repetição enquanto</h1>
    <button onclick="contar()">Contar</button>

    <script>
        function contar (){
        let numero = Number(prompt("Digite um número: "))
        while(numero > 0){
            alert(numero)
            numero --
        }
    }
    </script>
</body>
</html>
